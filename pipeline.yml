pipeline:
  agent: any
  tools:
    maven: "M3"
  stages:
    - stage: Build
      steps:
        - script: "mvn clean package"

    - stage: Test
      steps:
        - script: "mvn test"

    - stage: Deploy
      steps:
        - script: |
            SHORT_COMMIT="${env.GIT_COMMIT:0:7}"
            sshPublisher(
              publishers: [
                sshPublisherDesc(
                  configName: "Laplab",
                  transfers: [
                    sshTransfer(
                      sourceFiles: "target/*.jar",
                      removePrefix: "target",
                      remoteDirectory: "artifacts/series"
                    ),
                    sshTransfer(
                      sourceFiles: "docker/*",
                      removePrefix: "docker",
                      remoteDirectory: "artifacts/series",
                      execCommand: """
                        cd artifacts/series/ &&
                        date >> historial.txt &&
                        docker build -t series-app:$SHORT_COMMIT -t series-app:latest .
                      """
                    )
                  ],
                  usePromotionTimestamp: false,
                  verbose: true
                )
              ]
            )
  post:
    always:
      - script: "printenv | grep GIT"