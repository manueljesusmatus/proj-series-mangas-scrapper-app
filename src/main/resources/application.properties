# Server
spring.application.name=SerieApp
server.servlet.context-path=/api
server.port=8085

spring.aop.proxy-target-class=true

# Datasource
spring.datasource.url=jdbc:mysql://${DB_HOSTNAME:localhost}:${DB_PORT:3306}/${DB_DATABASE:series}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASS}

# Logging
#spring.jpa.show-sql=true
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
#logging.level.org.hibernate.orm.jdbc.bind=TRACE

# Navigate Page Vars
webpage.url=${URL}
webpage.xpath.main=/html/body/div[1]/main/div[2]/div[1]/div[1]/div
webpage.xpath.title=/div/div/h4
webpage.xpath.tipo=/div/span[2]
webpage.xpath.imagen=/div/style
webpage.attribute.id=data-identifier
webpage.attribute.url=href